name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        id: install
        shell: bash
        run: |
          set -o pipefail
          npm install --no-audit --no-fund --loglevel verbose 2>&1 | tee npm-install.log

      - name: Upload install diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-install-log
          path: npm-install.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Run unit and DOM tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee vitest.log

      - name: Upload Vitest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-log
          path: vitest.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Type-check
        run: npm run typecheck

      - name: Build Chrome extension
        run: npm run build

      - name: Upload unpacked extension
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cpdown-chrome-mv3
          path: .output/chrome-mv3
          if-no-files-found: error
          retention-days: 7